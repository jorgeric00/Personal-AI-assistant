name: App Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      LIFEOS_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run build:app
      - run: npx cap sync android

      # Con la clave de LifeOS en los secretos, el APK se firma siempre igual y se puede actualizar sin desinstalar.
      - name: Preparar la clave de firma
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lifeos.jks"
            echo "keystore=$RUNNER_TEMP/lifeos.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar el APK firmado
        if: steps.signing.outputs.keystore != ''
        working-directory: frontend/android
        env:
          LIFEOS_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          LIFEOS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/lifeos.apk"

      # Sin clave, un APK de depuración: se instala igual, pero cada compilación lleva otra firma.
      - name: Compilar el APK de depuración
        if: steps.signing.outputs.keystore == ''
        working-directory: frontend/android
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/lifeos.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-apk
          path: ${{ runner.temp }}/lifeos.apk

      # En main, el APK se publica siempre en la misma versión «app» para descargarlo desde el móvil.
      - name: Publicar el APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app "$RUNNER_TEMP/lifeos.apk#LifeOS.apk" --prerelease --target "$GITHUB_SHA" \
            --title "LifeOS para Android (última versión)" \
            --notes "APK compilado desde main ($GITHUB_SHA). Instrucciones en docs/app-android.md."
