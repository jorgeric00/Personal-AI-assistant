spring:
  application:
    name: lifeos
  datasource:
    url: ${LIFEOS_DB_URL:jdbc:postgresql://localhost:5432/lifeos}
    username: ${LIFEOS_DB_USER:lifeos}
    password: ${LIFEOS_DB_PASSWORD:lifeos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */30 * * * *"
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
      cookie:
        name: LIFEOS_SESSION
        http-only: true
        same-site: lax
        secure: ${LIFEOS_COOKIE_SECURE:false}
        max-age: 30d

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

lifeos:
  timezone: Europe/Madrid
  admin:
    email: ${LIFEOS_ADMIN_EMAIL:}
    password: ${LIFEOS_ADMIN_PASSWORD:}
    display-name: ${LIFEOS_ADMIN_NAME:}
  login:
    max-failed-attempts: 5
    lockout: 15m
