fitness.exercise.default.squat.name=Sentadilla
fitness.exercise.default.squat.instructions=Pies a la anchura de los hombros. Baja llevando la cadera hacia atrás y abajo como si te sentaras, con el pecho erguido, hasta donde puedas mantener la espalda neutra. Sube empujando el suelo con todo el pie.
fitness.exercise.default.squat.safety=Las rodillas siguen la dirección de las puntas de los pies. Si notas dolor en rodillas o espalda, reduce el recorrido o para.
fitness.exercise.default.barbell-squat.name=Sentadilla con barra
fitness.exercise.default.barbell-squat.equipment=Barra y rack
fitness.exercise.default.barbell-squat.instructions=Coloca la barra sobre la parte alta de la espalda, no sobre el cuello. Baja controlando con el tronco firme y sube empujando con todo el pie.
fitness.exercise.default.barbell-squat.safety=Usa los topes de seguridad del rack y aumenta el peso de forma progresiva.
fitness.exercise.default.lunge.name=Zancada
fitness.exercise.default.lunge.instructions=Da un paso largo hacia delante y baja hasta que ambas rodillas formen un ángulo cercano a 90 grados. Vuelve empujando con la pierna delantera y alterna.
fitness.exercise.default.lunge.safety=Mantén el tronco erguido y la rodilla delantera alineada con el pie. Apóyate en algo si te cuesta mantener el equilibrio.
fitness.exercise.default.romanian-deadlift.name=Peso muerto rumano
fitness.exercise.default.romanian-deadlift.equipment=Barra o mancuernas
fitness.exercise.default.romanian-deadlift.instructions=Con las rodillas ligeramente flexionadas, lleva la cadera hacia atrás y baja el peso pegado a las piernas hasta notar estiramiento detrás de los muslos. Sube extendiendo la cadera.
fitness.exercise.default.romanian-deadlift.safety=La espalda se mantiene neutra en todo el recorrido; no redondees la zona lumbar para bajar más.
fitness.exercise.default.glute-bridge.name=Puente de glúteos
fitness.exercise.default.glute-bridge.instructions=Tumbado boca arriba con las rodillas flexionadas y los pies apoyados, eleva la cadera apretando los glúteos hasta alinear rodillas, cadera y hombros. Baja despacio.
fitness.exercise.default.glute-bridge.safety=No arquees la zona lumbar al subir: el movimiento sale de la cadera.
fitness.exercise.default.bench-press.name=Press de banca
fitness.exercise.default.bench-press.equipment=Barra y banco
fitness.exercise.default.bench-press.instructions=Tumbado en el banco con los pies en el suelo y los omóplatos juntos, baja la barra controlada hasta la parte media del pecho y empújala hacia arriba.
fitness.exercise.default.bench-press.safety=Con cargas altas, pide a alguien que te asista o usa topes de seguridad.
fitness.exercise.default.push-up.name=Flexiones
fitness.exercise.default.push-up.instructions=Manos algo más abiertas que los hombros y cuerpo en línea recta de la cabeza a los talones. Baja el pecho hacia el suelo y empuja hasta estirar los brazos.
fitness.exercise.default.push-up.safety=Si no mantienes la línea del cuerpo, apoya las rodillas o hazlas contra una pared o un banco.
fitness.exercise.default.pull-up.name=Dominadas
fitness.exercise.default.pull-up.equipment=Barra de dominadas
fitness.exercise.default.pull-up.instructions=Cuelga de la barra con los brazos estirados y sube llevando el pecho hacia la barra hasta pasar la barbilla. Baja controlando hasta estirar los brazos.
fitness.exercise.default.pull-up.safety=Evita balancearte. Si aún no puedes hacer una completa, usa una banda elástica de asistencia o haz solo la bajada lenta.
fitness.exercise.default.dumbbell-row.name=Remo con mancuerna
fitness.exercise.default.dumbbell-row.equipment=Mancuerna y banco
fitness.exercise.default.dumbbell-row.instructions=Apoya una mano y una rodilla en el banco con la espalda plana. Tira de la mancuerna hacia la cadera llevando el codo hacia atrás y bájala despacio.
fitness.exercise.default.dumbbell-row.safety=No gires el tronco para subir el peso; si lo necesitas, el peso es excesivo.
fitness.exercise.default.lat-pulldown.name=Jalón al pecho
fitness.exercise.default.lat-pulldown.equipment=Máquina de polea
fitness.exercise.default.lat-pulldown.instructions=Sentado con los muslos sujetos, tira de la barra hacia la parte alta del pecho llevando los codos hacia abajo. Sube controlando.
fitness.exercise.default.lat-pulldown.safety=No tires de la barra por detrás de la nuca.
fitness.exercise.default.shoulder-press.name=Press de hombros con mancuernas
fitness.exercise.default.shoulder-press.equipment=Mancuernas
fitness.exercise.default.shoulder-press.instructions=De pie o sentado, con las mancuernas a la altura de los hombros, empújalas hacia arriba hasta casi estirar los brazos y bájalas controlando.
fitness.exercise.default.shoulder-press.safety=Aprieta el abdomen para no arquear la zona lumbar.
fitness.exercise.default.lateral-raise.name=Elevaciones laterales
fitness.exercise.default.lateral-raise.equipment=Mancuernas
fitness.exercise.default.lateral-raise.instructions=Con los codos ligeramente flexionados, eleva las mancuernas hacia los lados hasta la altura de los hombros y bájalas despacio.
fitness.exercise.default.lateral-raise.safety=Usa un peso ligero y no subas por encima de los hombros si notas molestias.
fitness.exercise.default.biceps-curl.name=Curl de bíceps
fitness.exercise.default.biceps-curl.equipment=Mancuernas o barra
fitness.exercise.default.biceps-curl.instructions=Con los codos pegados al cuerpo, flexiona los brazos subiendo el peso hacia los hombros y bájalo controlando.
fitness.exercise.default.biceps-curl.safety=No balancees el cuerpo para subir el peso.
fitness.exercise.default.bench-dip.name=Fondos en banco
fitness.exercise.default.bench-dip.equipment=Banco o silla estable
fitness.exercise.default.bench-dip.instructions=Apoya las manos en el borde del banco detrás de ti, baja flexionando los codos hacia atrás y sube estirando los brazos.
fitness.exercise.default.bench-dip.safety=Baja solo hasta donde no notes molestias en los hombros.
fitness.exercise.default.plank.name=Plancha
fitness.exercise.default.plank.instructions=Apoya antebrazos y puntas de los pies con el cuerpo en línea recta. Aprieta abdomen y glúteos y mantén la posición.
fitness.exercise.default.plank.safety=Para cuando no puedas mantener la cadera alineada; si cae, la zona lumbar sufre.
fitness.exercise.default.dead-bug.name=Bicho muerto
fitness.exercise.default.dead-bug.instructions=Tumbado boca arriba con los brazos hacia el techo y las rodillas a 90 grados, estira a la vez un brazo y la pierna contraria sin despegar la zona lumbar del suelo. Vuelve y alterna.
fitness.exercise.default.dead-bug.safety=Si la zona lumbar se despega del suelo, reduce el recorrido.
fitness.exercise.default.running.name=Correr
fitness.exercise.default.running.instructions=Empieza a un ritmo que te permita hablar y aumenta el tiempo o la distancia poco a poco.
fitness.exercise.default.running.safety=Calienta unos minutos andando o trotando suave. Si notas dolor en el pecho, mareo o falta de aire anormal, para.
fitness.exercise.default.cycling.name=Bicicleta
fitness.exercise.default.cycling.equipment=Bicicleta o bicicleta estática
fitness.exercise.default.cycling.instructions=Ajusta el sillín para que la rodilla quede casi estirada abajo. Mantén una cadencia cómoda y sube la intensidad de forma progresiva.
fitness.exercise.default.cycling.safety=Usa casco en exterior. Para si notas dolor en el pecho, mareo o falta de aire anormal.
fitness.exercise.default.walking.name=Caminar
fitness.exercise.default.walking.instructions=Camina a paso ligero, con los brazos acompañando el movimiento. Puedes aumentar la duración o añadir cuestas.
fitness.exercise.default.walking.safety=Usa calzado cómodo y aumenta la distancia poco a poco.
fitness.exercise.default.jump-rope.name=Saltar a la comba
fitness.exercise.default.jump-rope.equipment=Comba
fitness.exercise.default.jump-rope.instructions=Haz saltos cortos sobre la parte delantera del pie, girando la cuerda con las muñecas. Alterna periodos de salto y descanso.
fitness.exercise.default.jump-rope.safety=Salta sobre una superficie que amortigüe y empieza con intervalos cortos.
