fitness.exercise.default.squat.name=Squat
fitness.exercise.default.squat.instructions=Feet shoulder-width apart. Lower by pushing your hips back and down as if sitting, chest up, as far as you can keep a neutral back. Stand up by pushing through the whole foot.
fitness.exercise.default.squat.safety=Knees track in line with your toes. If you feel pain in your knees or back, shorten the range or stop.
fitness.exercise.default.barbell-squat.name=Barbell squat
fitness.exercise.default.barbell-squat.equipment=Barbell and rack
fitness.exercise.default.barbell-squat.instructions=Rest the bar on your upper back, not your neck. Lower under control with a braced torso and drive up through the whole foot.
fitness.exercise.default.barbell-squat.safety=Use the rack's safety bars and increase the weight gradually.
fitness.exercise.default.lunge.name=Lunge
fitness.exercise.default.lunge.instructions=Take a long step forward and lower until both knees are bent close to 90 degrees. Push back with the front leg and alternate.
fitness.exercise.default.lunge.safety=Keep your torso upright and the front knee in line with the foot. Hold onto something if balance is difficult.
fitness.exercise.default.romanian-deadlift.name=Romanian deadlift
fitness.exercise.default.romanian-deadlift.equipment=Barbell or dumbbells
fitness.exercise.default.romanian-deadlift.instructions=With knees slightly bent, push your hips back and lower the weight close to your legs until you feel a stretch in the back of your thighs. Stand up by extending your hips.
fitness.exercise.default.romanian-deadlift.safety=Keep a neutral back throughout; don't round your lower back to go lower.
fitness.exercise.default.glute-bridge.name=Glute bridge
fitness.exercise.default.glute-bridge.instructions=Lying on your back with knees bent and feet flat, lift your hips by squeezing your glutes until knees, hips and shoulders line up. Lower slowly.
fitness.exercise.default.glute-bridge.safety=Don't arch your lower back at the top: the movement comes from the hips.
fitness.exercise.default.bench-press.name=Bench press
fitness.exercise.default.bench-press.equipment=Barbell and bench
fitness.exercise.default.bench-press.instructions=Lying on the bench with feet on the floor and shoulder blades pulled together, lower the bar under control to mid-chest and press it up.
fitness.exercise.default.bench-press.safety=With heavy loads, use a spotter or safety bars.
fitness.exercise.default.push-up.name=Push-up
fitness.exercise.default.push-up.instructions=Hands slightly wider than your shoulders and body in a straight line from head to heels. Lower your chest toward the floor and push back up.
fitness.exercise.default.push-up.safety=If you can't hold the body line, do them on your knees or against a wall or bench.
fitness.exercise.default.pull-up.name=Pull-up
fitness.exercise.default.pull-up.equipment=Pull-up bar
fitness.exercise.default.pull-up.instructions=Hang from the bar with straight arms and pull your chest toward the bar until your chin clears it. Lower under control to straight arms.
fitness.exercise.default.pull-up.safety=Avoid swinging. If you can't do a full one yet, use an assistance band or do slow lowering reps only.
fitness.exercise.default.dumbbell-row.name=Dumbbell row
fitness.exercise.default.dumbbell-row.equipment=Dumbbell and bench
fitness.exercise.default.dumbbell-row.instructions=Place one hand and one knee on the bench with a flat back. Pull the dumbbell toward your hip, driving the elbow back, and lower it slowly.
fitness.exercise.default.dumbbell-row.safety=Don't twist your torso to lift the weight; if you need to, it's too heavy.
fitness.exercise.default.lat-pulldown.name=Lat pulldown
fitness.exercise.default.lat-pulldown.equipment=Cable machine
fitness.exercise.default.lat-pulldown.instructions=Seated with your thighs secured, pull the bar to your upper chest by driving the elbows down. Return under control.
fitness.exercise.default.lat-pulldown.safety=Don't pull the bar behind your neck.
fitness.exercise.default.shoulder-press.name=Dumbbell shoulder press
fitness.exercise.default.shoulder-press.equipment=Dumbbells
fitness.exercise.default.shoulder-press.instructions=Standing or seated with the dumbbells at shoulder height, press them overhead until your arms are nearly straight and lower under control.
fitness.exercise.default.shoulder-press.safety=Brace your abs so you don't arch your lower back.
fitness.exercise.default.lateral-raise.name=Lateral raise
fitness.exercise.default.lateral-raise.equipment=Dumbbells
fitness.exercise.default.lateral-raise.instructions=With elbows slightly bent, raise the dumbbells out to the sides up to shoulder height and lower them slowly.
fitness.exercise.default.lateral-raise.safety=Use a light weight and don't go above shoulder height if you feel discomfort.
fitness.exercise.default.biceps-curl.name=Biceps curl
fitness.exercise.default.biceps-curl.equipment=Dumbbells or barbell
fitness.exercise.default.biceps-curl.instructions=With your elbows close to your body, curl the weight toward your shoulders and lower it under control.
fitness.exercise.default.biceps-curl.safety=Don't swing your body to lift the weight.
fitness.exercise.default.bench-dip.name=Bench dip
fitness.exercise.default.bench-dip.equipment=Bench or sturdy chair
fitness.exercise.default.bench-dip.instructions=Place your hands on the edge of the bench behind you, lower by bending your elbows back and press up to straight arms.
fitness.exercise.default.bench-dip.safety=Only lower as far as your shoulders feel comfortable.
fitness.exercise.default.plank.name=Plank
fitness.exercise.default.plank.instructions=Rest on your forearms and toes with your body in a straight line. Brace your abs and glutes and hold.
fitness.exercise.default.plank.safety=Stop when you can't keep your hips aligned; if they sag, your lower back takes the strain.
fitness.exercise.default.dead-bug.name=Dead bug
fitness.exercise.default.dead-bug.instructions=Lying on your back with arms toward the ceiling and knees at 90 degrees, extend one arm and the opposite leg without lifting your lower back off the floor. Return and alternate.
fitness.exercise.default.dead-bug.safety=If your lower back lifts off the floor, shorten the range.
fitness.exercise.default.running.name=Running
fitness.exercise.default.running.instructions=Start at a pace that lets you talk and build up time or distance gradually.
fitness.exercise.default.running.safety=Warm up with a few minutes of walking or easy jogging. Stop if you feel chest pain, dizziness or unusual shortness of breath.
fitness.exercise.default.cycling.name=Cycling
fitness.exercise.default.cycling.equipment=Bike or stationary bike
fitness.exercise.default.cycling.instructions=Set the saddle so your knee is almost straight at the bottom. Keep a comfortable cadence and raise the intensity gradually.
fitness.exercise.default.cycling.safety=Wear a helmet outdoors. Stop if you feel chest pain, dizziness or unusual shortness of breath.
fitness.exercise.default.walking.name=Walking
fitness.exercise.default.walking.instructions=Walk briskly, letting your arms swing naturally. You can increase the duration or add hills.
fitness.exercise.default.walking.safety=Wear comfortable shoes and increase the distance gradually.
fitness.exercise.default.jump-rope.name=Jump rope
fitness.exercise.default.jump-rope.equipment=Jump rope
fitness.exercise.default.jump-rope.instructions=Make small jumps on the balls of your feet, turning the rope with your wrists. Alternate jumping and rest periods.
fitness.exercise.default.jump-rope.safety=Jump on a shock-absorbing surface and start with short intervals.
